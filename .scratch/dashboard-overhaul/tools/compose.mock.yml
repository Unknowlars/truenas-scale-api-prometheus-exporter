# Sanitized review stack: synthetic exporter (fictional names), backfilled
# Prometheus, Grafana 13.0.1 + renderer. Everything binds to 127.0.0.1.
# Driven by ./mock_stack.sh; MOCK_PROFILE=27|25.10, MOCK_SCRAPE=mock|none.
name: truenas-dash-mock
services:
  mock:
    image: truenas-exporter-test:py3.12
    entrypoint: ["python3", "-I", "/app/mock_exporter.py", "serve", "--profile", "${MOCK_PROFILE:-27}"]
    volumes:
      - ./mock_exporter.py:/app/mock_exporter.py:ro
      - ../../../docs/metrics-contract.json:/app/metrics-contract.json:ro
    ports: ["127.0.0.1:9108:9108"]
  prometheus:
    image: prom/prometheus:v3.5.0
    user: "0"
    command: ["--config.file=/etc/prometheus/${MOCK_SCRAPE:-mock}.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prom-mock.yml:/etc/prometheus/mock.yml:ro
      - ./prom-none.yml:/etc/prometheus/none.yml:ro
      - ${MOCK_TSDB:?set MOCK_TSDB}:/prometheus
    ports: ["127.0.0.1:9090:9090"]
  renderer:
    image: grafana/grafana-image-renderer:latest
    environment: {AUTH_TOKEN: "${RENDER_TOKEN:?set RENDER_TOKEN}"}
  grafana:
    image: grafana/grafana:13.0.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: "${RENDER_TOKEN}"
      GF_FEATURE_TOGGLES_ENABLE: kubernetesDashboards dashboardNewLayouts
    volumes:
      - ./prov-api:/etc/grafana/provisioning:ro   # datasource only; render_tabs.sh imports dashboards via API
    ports: ["127.0.0.1:3000:3000"]
