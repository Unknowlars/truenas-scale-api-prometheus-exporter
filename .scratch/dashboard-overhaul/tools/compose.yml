# Local dashboard review stack. Everything binds to 127.0.0.1.
# Required env: TRUENAS_WS_URL, TRUENAS_API_KEY_FILE (absolute path OUTSIDE
# the repo, mode 600), RENDER_TOKEN (any random string, e.g. `openssl rand -hex 16`).
# Optional: TRUENAS_VERIFY_TLS (default true).
name: truenas-dash-review
services:
  exporter:
    image: truenas-scale-api-prometheus-exporter:validate   # built by ./scripts/validate.sh
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TRUENAS_WS_URL: ${TRUENAS_WS_URL:?set TRUENAS_WS_URL}
      TRUENAS_VERIFY_TLS: ${TRUENAS_VERIFY_TLS:-true}
      TRUENAS_API_KEY_FILE: /run/secrets/key
    volumes: ["${TRUENAS_API_KEY_FILE:?set TRUENAS_API_KEY_FILE}:/run/secrets/key:ro"]
    ports: ["127.0.0.1:9108:9108"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]
  renderer:
    image: grafana/grafana-image-renderer:latest
    environment: {AUTH_TOKEN: "${RENDER_TOKEN:?set RENDER_TOKEN}"}
  grafana:
    image: grafana/grafana:13.0.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: "${RENDER_TOKEN}"
      GF_FEATURE_TOGGLES_ENABLE: kubernetesDashboards dashboardNewLayouts
    volumes:
      - ./prov:/etc/grafana/provisioning:ro
      - ../../../grafana-dashboard:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
