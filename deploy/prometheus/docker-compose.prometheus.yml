services:
  truenas-exporter:
    build:
      context: ../..
      args:
        PYTHON_VERSION: "3.14.8"
    image: truenas-scale-api-prometheus-exporter:local
    env_file:
      - ../../.env
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      - truenas-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

