global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: truenas_exporter
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ["truenas-exporter:9108"]

